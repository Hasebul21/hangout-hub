<app-navbar></app-navbar>

<div class="profile-page">
  <div class="profile-card">
    <div class="profile-banner">
      <div class="banner-content">
        <img class="profile-avatar" [src]="avatarPreview" (error)="useDefaultAvatar($event)" alt="Profile" />
        <div class="profile-identity">
          <h2 class="profile-name">{{ loggedInUser?.userName }}</h2>
          <p class="profile-title">{{ form.professionalTitle || 'Hangout Hub member' }}</p>
          @if (form.location) {
            <p class="profile-location">
              <mat-icon>location_on</mat-icon> {{ form.location }}
            </p>
          }
        </div>
      </div>
    </div>

    <div class="edit-section">
      <h3 class="section-title">Edit Profile</h3>
      <form (ngSubmit)="updateProfile()">
        <div class="form-grid">
          <div class="form-group">
            <label>Profile Picture</label>
            <div class="file-input-wrap">
              <input type="file" id="profile" name="profile" accept="image/*" (change)="onFileSelected($event)" />
              <label for="profile" class="file-label">
                <mat-icon>upload</mat-icon>
                {{ avatarFile ? avatarFile.name : 'Choose image' }}
              </label>
            </div>
          </div>
          <div class="form-group">
            <label for="title">Professional Title</label>
            <input type="text" id="title" name="title" maxlength="100" [(ngModel)]="form.professionalTitle"
              placeholder="e.g. Software Developer" />
          </div>
          <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" maxlength="100" [(ngModel)]="form.location"
              placeholder="e.g. Dhaka, Bangladesh" />
          </div>
          <div class="form-group">
            <label for="portfolio">Portfolio URL</label>
            <input type="url" id="portfolio" name="portfolio" maxlength="200" [(ngModel)]="form.portfolio"
              placeholder="https://yoursite.dev" />
          </div>
          <div class="form-group">
            <label for="instagram">Instagram Handle</label>
            <input type="text" id="instagram" name="instagram" maxlength="100" [(ngModel)]="form.instagram"
              placeholder="@yourhandle" />
          </div>
          <div class="form-group">
            <label for="skills">Skills</label>
            <input type="text" id="skills" name="skills" maxlength="100" [(ngModel)]="form.skills"
              placeholder="JavaScript, Angular, Node.js" />
          </div>
          <div class="form-group">
            <label for="hobbies">Hobbies</label>
            <input type="text" id="hobbies" name="hobbies" maxlength="100" [(ngModel)]="form.hobbies"
              placeholder="Traveling, Photography" />
          </div>
          <div class="form-group full-width">
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" maxlength="300" rows="3" [(ngModel)]="form.bio"
              placeholder="Tell people a bit about yourself..."></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-cancel" routerLink="/home">Cancel</button>
          <button type="submit" class="btn-save" [disabled]="saving">{{ saving ? 'Saving...' : 'Save Changes' }}</button>
        </div>
      </form>
    </div>
  </div>
</div>
