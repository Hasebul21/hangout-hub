<div class="contacts-panel">
  <div class="panel-header">
    <div class="my-info">
      <img class="my-avatar" [src]="avatarUrl(me?.id, me?.updatedAt)" (error)="useDefaultAvatar($event)" alt="me" />
      <div>
        <div class="my-name">{{ me?.userName }}</div>
        <div class="my-status"><span class="dot"></span> Online</div>
      </div>
    </div>
  </div>

  <div class="search-wrap">
    <input class="search-input" placeholder="Search contacts..." [(ngModel)]="searchTerm" />
  </div>

  <div class="contacts-list">
    @for (user of filteredUsers; track user.id) {
      <div class="contact-item" [class.active]="user.id === selectedUser?.id" (click)="selectUser.emit(user)">
        <div class="contact-avatar-wrap">
          <img [src]="avatarUrl(user.id)" (error)="useDefaultAvatar($event)" class="contact-avatar" alt="avatar" />
          <span class="status-dot" [class.online]="isOnline(user)"></span>
        </div>
        <div class="contact-details">
          <span class="contact-name">
            {{ user.userName }}
            @if (user.isOwner) {
              <nz-tag nzColor="purple" class="owner-tag">Owner</nz-tag>
            }
            @if (user.isDemo) {
              <nz-tag class="owner-tag">Demo</nz-tag>
            }
          </span>
          <span class="contact-sub">{{ statusText(user) }}</span>
        </div>
        <nz-badge [nzCount]="unreadCounts[user.id] || 0" class="unread-badge"></nz-badge>
      </div>
    } @empty {
      <div class="no-contacts">No contacts found</div>
    }
  </div>
</div>
