services:
  - type: web
    name: hangout-hub-api
    runtime: docker
    rootDir: hangout-hub-backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://hangout-hub.vercel.app,https://hangout-hub-hasebul21s-projects.vercel.app
