<div class="chat-header">
  <img class="header-avatar" [src]="avatarUrl(selectedUser.id)" (error)="useDefaultAvatar($event)" alt="avatar" />
  <div class="header-info">
    <span class="header-name">{{ selectedUser.userName }}</span>
    <span class="header-status">
      <span class="online-dot" [class.offline]="!online"></span> {{ statusText() }}
    </span>
  </div>
</div>

<div class="chat-messages" #messageList>
  @for (message of messages; track message.id) {
    <div class="msg-row" [class.msg-right]="isMine(message)" [class.msg-left]="!isMine(message)">
      <img class="msg-avatar" [src]="avatarUrl(message.senderId)" (error)="useDefaultAvatar($event)" alt="avatar" />
      <div class="msg-body">
        <div class="bubble">
          <p class="bubble-text">{{ message.content }}</p>
        </div>
        <div class="msg-meta">
          <span class="msg-time">{{ message.createdAt | date: 'MMM d, h:mm a' }}</span>
        </div>
      </div>
    </div>
  } @empty {
    <div class="empty-chat">
      <mat-icon>waving_hand</mat-icon>
      <p>Say hello to {{ selectedUser.userName }}!</p>
    </div>
  }
</div>

<div class="chat-input-bar">
  <input class="chat-input" placeholder="Type a message..." maxlength="1000" [(ngModel)]="content"
    (keydown.enter)="send()" />
  <button class="send-btn" (click)="send()" [disabled]="!content.trim() || sending">
    <mat-icon>send</mat-icon>
  </button>
</div>
