name: hangout-hub

services:
  postgres:
    image: postgres:16
    container_name: hangouthub_postgres
    environment:
      POSTGRES_DB: hangouthub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./hangout-hub-backend
    container_name: hangouthub_backend
    depends_on:
      - postgres
    environment:
      PORT: 8080
      ALLOWED_ORIGINS: http://localhost:4200
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/hangouthub
      JWT_SECRET: local-docker-secret
    ports:
      - "8080:8080"
    restart: on-failure

  client:
    build: ./hangout-hub-client
    container_name: hangouthub_client
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  postgres-data:
