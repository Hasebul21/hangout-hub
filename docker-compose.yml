services:
  postgres:
    image: postgres:16
    container_name: quickchat_postgres
    environment:
      POSTGRES_DB: quickchat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: quickchat_redis
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: quickchat_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  backend:
    build: ./quick-chat-backend
    container_name: quickchat_backend
    depends_on:
      - postgres
      - redis
      - elasticsearch
    environment:
      PORT: 8080
      ALLOWED_ORIGINS: http://localhost:4200
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/quickchat
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      JWT_SECRET: local-docker-secret
    ports:
      - "8080:8080"
    restart: on-failure

  client:
    build: ./quick-chat-client
    container_name: quickchat_client
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  postgres-data:
  es-data:
